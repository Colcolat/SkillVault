version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: skillvault-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2931
      POSTGRES_DB: skillvault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillvault-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=skillvault;Username=postgres;Password=2931

volumes:
  postgres_data:
